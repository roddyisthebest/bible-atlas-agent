[project]
name = "bible-atlas-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain>=1.3.13",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "pinecone>=9.1.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
# 프로젝트 루트를 sys.path 에 추가 → tests/*.py 에서 `from agents.places...` 가능
pythonpath = ["."]
testpaths = ["tests"]
